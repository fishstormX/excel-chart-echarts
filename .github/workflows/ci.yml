name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build release artifacts only (do not create a GitHub Release)"
        type: boolean
        default: true

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build TypeScript
        working-directory: ts
        run: |
          npm ci
          npm run build

      - name: Install Python package + fixture deps
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install openpyxl xlsxwriter

      - name: Generate fixtures
        run: |
          python tests/gen_samples.py fixtures
          python tests/gen_fixtures_extra.py fixtures
          python tests/gen_errbars.py fixtures
          python tests/gen_chartex.py fixtures
          python tests/gen_maps.py fixtures

      - name: Unit tests (formats)
        run: python tests/test_formats.py

      - name: Parity (Python ≡ TypeScript)
        run: python tests/parity.py

  release:
    name: Build release packages
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build TypeScript package
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm pack
          ls -la excel-chart-echarts-*.tgz

      - name: Build Python package
        run: |
          python -m pip install -U pip build
          python -m build
          ls -la dist/

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp ts/excel-chart-echarts-*.tgz release-assets/
          cp dist/excel_chart_echarts-*-py3-none-any.whl release-assets/
          cp dist/excel_chart_echarts-*.tar.gz release-assets/ || true
          VER="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          # ensure stable tgz name matching docs (skip if pack already used that name)
          SRC=$(ls release-assets/excel-chart-echarts-*.tgz | head -1)
          DEST="release-assets/excel-chart-echarts-${VER}.tgz"
          if [ "$SRC" != "$DEST" ]; then
            cp "$SRC" "$DEST"
          fi
          ls -la release-assets/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: excel-chart-echarts-${{ env.VERSION }}
          path: release-assets/*


      - name: Publish to npm (stage)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret missing — skip npm publish."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          # Stage-only granular tokens cannot npm publish directly.
          # Maintainer must later approve the staged package in the browser / CLI.
          set +e
          OUT=$(npm stage publish --access public 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          rm -f .npmrc
          if [ $CODE -eq 0 ]; then
            echo "Staged to npm. Approve: npm stage list && npm stage approve <id>"
          elif echo "$OUT" | grep -qiE 'E409|previously published|already staged|Cannot stage'; then
            echo "npm stage skipped — this version is already staged or published."
          else
            exit $CODE
          fi


      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "PYPI_TOKEN secret missing — skip PyPI upload."
            exit 1
          fi
          python -m pip install -U twine
          set +e
          OUT=$(twine upload dist/* 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "Uploaded to PyPI."
          elif echo "$OUT" | grep -qiE 'File already exists|already been uploaded'; then
            echo "PyPI upload skipped — this version is already on PyPI."
          else
            exit $CODE
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cat > /tmp/release-notes.md << MD
          ## excel-chart-echarts ${TAG}

          ### Install (from this release)

          **Node / CLI**

          \`\`\`bash
          npm i -g excel-chart-echarts@${VER}
          excel-chart-echarts book.xlsx -j -o out.json
          \`\`\`

          (GitHub Release asset still attached if you prefer offline install.)

          **Python / CLI**

          \`\`\`bash
          pip install excel-chart-echarts==${VER}
          xlsx2echarts book.xlsx -j -o out.json
          \`\`\`

          \`-j\` / \`--json\` = one-shot JSON (no preview.html / split files). Omit \`-j\` for the full export directory.
          MD
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$TAG" release-assets/* \
            --title "excel-chart-echarts ${TAG}" \
            --notes-file /tmp/release-notes.md
