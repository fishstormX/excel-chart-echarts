[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-chart-echarts"
version = "1.0.1"
description = "Convert embedded native Excel charts (DrawingML in .xlsx/.xlsm/.xltx/.xltm) into Apache ECharts options — not whole-workbook charting; TypeScript & Python, zero-dependency, with CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "妙妙鱼 / fishstormX", email = "stormnetwork@163.com"}]
keywords = ["excel", "xlsx", "xlsm", "xltx", "xltm", "echarts", "chart", "ooxml", "drawingml"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart"]

[project.urls]
Homepage = "https://github.com/fishstormX/excel-chart-echarts"
Documentation = "https://github.com/fishstormX/excel-chart-echarts#readme"
Repository = "https://github.com/fishstormX/excel-chart-echarts"
Demo = "https://jev.fishmaple.cn/excelECharts/"
Issues = "https://github.com/fishstormX/excel-chart-echarts/issues"

[project.scripts]
xlsx2echarts = "xlsx2echarts.cli:main"
excel-chart-echarts = "xlsx2echarts.cli:main"
excel-echarts = "xlsx2echarts.cli:main"  # deprecated alias


[tool.setuptools]
packages = ["xlsx2echarts"]

[tool.setuptools.package-data]
xlsx2echarts = ["static/*.js", "static/geo/*.json"]
