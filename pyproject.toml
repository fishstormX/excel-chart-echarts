[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-echarts"
version = "1.0.0"
description = "Convert native Excel charts (DrawingML in .xlsx/.xlsm/.xltx/.xltm) into Apache ECharts options — zero dependencies, SDK + CLI (+ optional HTTP API)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "妙妙鱼 / fishstormX", email = "stormnetwork@163.com"}]
keywords = ["excel", "xlsx", "xlsm", "xltx", "xltm", "echarts", "chart", "ooxml", "drawingml"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart"]

[project.urls]
Homepage = "https://github.com/fishstormX/excel2Echarts"
Documentation = "https://github.com/fishstormX/excel2Echarts#readme"
Repository = "https://github.com/fishstormX/excel2Echarts"

[project.scripts]
xlsx2echarts = "xlsx2echarts.cli:main"
excel-echarts = "xlsx2echarts.cli:main"

[tool.setuptools]
packages = ["xlsx2echarts"]

[tool.setuptools.package-data]
xlsx2echarts = ["static/*.js", "static/geo/*.json"]
